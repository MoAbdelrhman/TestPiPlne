name: Run Project Check

on:
  pull_request:
    branches:
      - main
      - Dev
      - Test
jobs:
  run-project:
    name: Run & Verify Project
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🗄️ Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore Order.sln

      - name: 🔨 Build Solution
        run: dotnet build Order.sln --configuration Release

      - name: 🚀 Run Project (Verify Starts Correctly)
        run: |
          dotnet run --project Order.Api/Order.Api.csproj &
          APP_PID=$!
          
          # Wait for app to start
          echo "Waiting for application to start..."
          sleep 15
          
          # Check if process is still running
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ Project is running correctly!"
            kill $APP_PID
          else
            echo "❌ Project failed to start!"
            exit 1
          fi
